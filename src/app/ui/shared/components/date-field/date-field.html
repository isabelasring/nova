<div class="date-field">

  <div class="date-field__row">

    <label class="date-box">
      <span class="date-box__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect
            x="4"
            y="5"
            width="16"
            height="15"
            rx="2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <path
            d="M8 3.5v3M16 3.5v3M4 9.5h16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <span class="date-box__copy">
        <span class="date-box__label">Día</span>
        <input
          class="date-box__value"
          type="text"
          inputmode="numeric"
          maxlength="2"
          placeholder="DD"
          autocomplete="off"
          [disabled]="disabled()"
          [value]="day()"
          (input)="onDayInput($any($event.target).value)"
          (blur)="blur()"
        />
      </span>
    </label>

    <label class="date-box">
      <span class="date-box__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect
            x="4"
            y="5"
            width="16"
            height="15"
            rx="2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <path
            d="M8 3.5v3M16 3.5v3M4 9.5h16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <span class="date-box__copy">
        <span class="date-box__label">Mes</span>
        <span class="date-box__month">
          <select
            [disabled]="disabled()"
            [value]="month()"
            (change)="onMonthChange($any($event.target).value)"
            (blur)="blur()"
          >
            <option value="" hidden>MM</option>
            @for (item of months; track item.value) {
              <option [value]="item.value">{{ item.value }}</option>
            }
          </select>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 10l5 5 5-5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </span>
      </span>
    </label>

    <label class="date-box">
      <span class="date-box__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect
            x="4"
            y="5"
            width="16"
            height="15"
            rx="2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <path
            d="M8 3.5v3M16 3.5v3M4 9.5h16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </span>
      <span class="date-box__copy">
        <span class="date-box__label">Año</span>
        <input
          class="date-box__value"
          type="text"
          inputmode="numeric"
          maxlength="4"
          placeholder="AAAA"
          autocomplete="off"
          [disabled]="disabled()"
          [value]="year()"
          (input)="onYearInput($any($event.target).value)"
          (blur)="blur()"
        />
      </span>
    </label>

    @if (withTime()) {
      <label class="date-box">
        <span class="date-box__copy">
          <span class="date-box__label">Hora</span>
          <input
            class="date-box__value"
            type="time"
            [disabled]="disabled()"
            [value]="time()"
            (input)="onTimeInput($any($event.target).value)"
            (blur)="blur()"
          />
        </span>
      </label>
    }

  </div>

  @if (hint()) {
    <p class="date-field__hint">{{ hint() }}</p>
  }

</div>
