@if (saveSuccess.visible()) {

  <div
    class="pu-save-ok"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="pu-save-ok-title"
    style="position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;"
  >

    <button
      type="button"
      aria-label="Cerrar"
      (click)="saveSuccess.dismiss()"
      style="position:absolute;inset:0;border:0;margin:0;padding:0;background:rgba(17,24,39,0.4);cursor:pointer;"
    ></button>

    <article
      style="position:relative;z-index:1;width:300px;max-width:calc(100vw - 32px);margin-top:28px;padding:48px 24px 20px;box-sizing:border-box;background:#ffffff;border-radius:18px;box-shadow:0 16px 40px rgba(0,0,0,0.14);text-align:center;"
    >

      <div
        aria-hidden="true"
        style="position:absolute;top:0;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(61,207,142,0.3);"
      >
        <svg
          width="34"
          height="34"
          viewBox="0 0 48 48"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="24" cy="24" r="20.5" stroke="#3DCF8E" stroke-width="2"/>
          <path
            d="M16 24.5 L21.5 30 L32.5 17.5"
            stroke="#3DCF8E"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <h2
        id="pu-save-ok-title"
        style="margin:0 0 8px;padding:0;color:#111827;font-size:22px;font-weight:700;line-height:1.25;"
      >
        {{ saveSuccess.title() }}
      </h2>

      <p
        style="margin:0 0 20px;padding:0;color:#9ca3af;font-size:14px;font-weight:400;line-height:1.5;"
      >
        {{ saveSuccess.message() }}
      </p>

      <cb-button
        typeButton="primary"
        sizeButton="default"
        width="fill"
        (click)="saveSuccess.confirm()"
      >
        {{ saveSuccess.buttonLabel() }}
      </cb-button>

    </article>

  </div>

}
