@if (saveSuccess.visible()) {

  <button
    type="button"
    class="notice-scrim"
    aria-label="Cerrar aviso"
    (click)="saveSuccess.dismiss()"
  ></button>

  <app-inline-alert
    [title]="saveSuccess.title()"
    [description]="saveSuccess.message()"
    (closed)="saveSuccess.dismiss()"
  />

}
