<div
  class="option-select"
  [class.option-select--open]="open()"
  [class.option-select--disabled]="locked()"
>

  <button
    type="button"
    class="option-select__box"
    [disabled]="locked()"
    [attr.aria-expanded]="open()"
    (click)="toggle($event)"
  >

    <span class="option-select__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path
          d="M7 4.5h7.2L18.5 9v10.2a1.3 1.3 0 0 1-1.3 1.3H7A1.3 1.3 0 0 1 5.7 19.2V5.8A1.3 1.3 0 0 1 7 4.5z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path
          d="M14 4.6V9h4.2M8.2 12.2h6.2M8.2 15.4h4.4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </span>

    <span class="option-select__copy">
      @if (label()) {
        <span class="option-select__label">{{ label() }}</span>
      }
      <span
        class="option-select__value"
        [class.option-select__value--empty]="!selectedLabel()"
      >
        {{ selectedLabel() || placeholder() }}
      </span>
    </span>

    <span class="option-select__chevron" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        @if (open()) {
          <path
            d="M7 14l5-5 5 5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        } @else {
          <path
            d="M7 10l5 5 5-5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        }
      </svg>
    </span>

  </button>

  @if (open()) {

    <ul class="option-select__menu" role="listbox">
      @for (option of choices(); track option.value) {
        <li>
          <button
            type="button"
            class="option-select__option"
            [class.option-select__option--selected]="
              option.value === shown()
            "
            (click)="pick(option, $event)"
          >
            {{ option.label }}
          </button>
        </li>
      }
    </ul>

  }

</div>

@if (hint()) {
  <p class="option-select__hint">{{ hint() }}</p>
}
