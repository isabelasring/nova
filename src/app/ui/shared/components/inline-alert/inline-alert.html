<div class="inline-alert" role="status">

  <span class="inline-alert__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
      <path
        d="M8 12.2 10.8 15 16.2 9.2"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </span>

  <div class="inline-alert__copy">
    <strong>{{ title() }}</strong>
    <p>{{ description() }}</p>
  </div>

  <button
    type="button"
    class="inline-alert__close"
    aria-label="Cerrar"
    (click)="closed.emit()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M7 7l10 10M17 7 7 17"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
      />
    </svg>
  </button>

</div>
