<label class="search-field">

  <svg viewBox="0 0 24 24" aria-hidden="true">
    <circle
      cx="11"
      cy="11"
      r="6.5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
    />
    <path
      d="M16 16.5 20 20.5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
    />
  </svg>

  <input
    #box
    type="search"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="shown()"
    (input)="onInput($any($event.target).value)"
    (blur)="blur()"
  />

</label>
