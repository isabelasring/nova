@if (visible()) {

<div class="alert-backdrop">

  <div class="alert-container">

    <div class="alert-header">

      <h2>{{ title() }}</h2>

      <cb-button
        typeButton="secondary"
        sizeButton="small"
        width="hug"
        (click)="close()"
      >
        ✕
      </cb-button>

    </div>

    <div class="alert-body">

      <p>{{ message() }}</p>

      @if (confirmMode()) {

        <div class="alert-actions">

          <cb-button
            typeButton="secondary"
            sizeButton="default"
            width="hug"
            (click)="cancel()"
          >
            {{ cancelLabel() }}
          </cb-button>

          <cb-button
            typeButton="primary"
            sizeButton="default"
            width="hug"
            (click)="confirm()"
          >
            {{ confirmLabel() }}
          </cb-button>

        </div>

      } @else {

        <cb-button
          typeButton="primary"
          sizeButton="default"
          width="hug"
          (click)="close()"
        >
          Aceptar
        </cb-button>

      }

    </div>

  </div>

</div>

}
