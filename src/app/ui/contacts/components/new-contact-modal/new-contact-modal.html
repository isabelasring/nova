@if (visible()) {

<div class="modal-backdrop">

  <div class="modal-container">

    <div class="modal-header">

      <div>

        <h2>Nuevo contacto</h2>

        <span class="modal-subtitle">
          Registro de contacto de aplicación
        </span>

      </div>

      <button
        type="button"
        class="close-button"
        (click)="close()"
      >
        ✕
      </button>

    </div>

    <div
      class="modal-body"
      [formGroup]="form"
    >

      <div class="form-grid">

        <div class="field">

          <app-option-select
            formControlName="evc"
            label="Célula"
            placeholder="Seleccione una célula"
            [options]="evcOptions"
            (valueChange)="onEvcChange()"
          />

        </div>

        <div class="field">

          <app-option-select
            formControlName="linea"
            label="LC"
            placeholder="Seleccione una LC"
            [options]="lineaOptions()"
            (valueChange)="onLineaChange()"
          />

        </div>

      </div>

      <div class="field">

        <app-option-select
          formControlName="codigoAplicacion"
          label="Aplicación"
          placeholder="Seleccione una aplicación"
          [options]="appChoiceOptions()"
          (valueChange)="onAppChange($event)"
        />

      </div>

      <div class="form-grid">

        <div class="field">

          <label>Nombre</label>

          <input
            type="text"
            formControlName="nombre"
            placeholder="Nombre completo"
          />

        </div>

        <div class="field">

          <label>Celular</label>

          <app-phone-input
            formControlName="celular"
          />

        </div>

      </div>

      <div class="field">

        <label>Correo electrónico</label>

        <input
          type="email"
          formControlName="correo"
          placeholder="correo@bancolombia.com.co"
        />

      </div>

      <div class="field">

        <label>Horario</label>

        <input
          type="text"
          formControlName="horario"
          value="24/7"
          readonly
        />

      </div>

    </div>

    <div class="modal-footer">

      <button
        type="button"
        class="btn-secondary"
        (click)="close()"
      >
        Cancelar
      </button>

      <button
        type="button"
        class="btn-save"
        (click)="save()"
      >
        Guardar contacto
      </button>

      @if (formError()) {
        <p class="form-error">{{ formError() }}</p>
      }

    </div>

  </div>

</div>

}
