@if (visible()) {

<div class="modal-backdrop">

  <div class="modal-container">

    <div class="modal-header">

      <div>

        <h2>Nuevo contacto</h2>

        <span class="modal-subtitle">
          Registro de contacto de aplicación
        </span>

      </div>

      <button
        type="button"
        class="close-button"
        (click)="close()"
      >
        ✕
      </button>

    </div>

    <div
      class="modal-body"
      [formGroup]="form"
    >

      <div class="form-grid">

        <div class="field">

          <label>Célula</label>

          <select
            formControlName="evc"
            (change)="onEvcChange()"
          >
            <option value="">Seleccione una célula</option>
            @for (evc of evcOptions; track evc) {
              <option [value]="evc">{{ evc }}</option>
            }
          </select>

        </div>

        <div class="field">

          <label>LC</label>

          <select
            formControlName="linea"
            (change)="onLineaChange()"
          >
            <option value="">Seleccione una LC</option>
            @for (linea of lineaOptions(); track linea) {
              <option [value]="linea">{{ linea }}</option>
            }
          </select>

        </div>

      </div>

      <div class="field">

        <label>Aplicación</label>

        <select
          formControlName="codigoAplicacion"
          (change)="onAppChange()"
        >
          <option value="">Seleccione una aplicación</option>
          @for (app of appOptions(); track app.codigoAplicacion) {
            <option [value]="app.codigoAplicacion">
              {{ app.codigoAplicacion }} — {{ app.nombreAplicacion }}
            </option>
          }
        </select>

      </div>

      <div class="form-grid">

        <div class="field">

          <label>Nombre</label>

          <input
            type="text"
            formControlName="nombre"
            placeholder="Nombre completo"
          />

        </div>

        <div class="field">

          <label>Celular</label>

          <app-phone-input
            formControlName="celular"
          />

        </div>

      </div>

      <div class="field">

        <label>Correo electrónico</label>

        <input
          type="email"
          formControlName="correo"
          placeholder="correo@bancolombia.com.co"
        />

      </div>

      <div class="field">

        <label>Horario</label>

        <input
          type="text"
          formControlName="horario"
          value="24/7"
          readonly
        />

      </div>

    </div>

    <div class="modal-footer">

      <button
        type="button"
        class="btn-secondary"
        (click)="close()"
      >
        Cancelar
      </button>

      <button
        type="button"
        class="btn-save"
        [disabled]="!canSave()"
        (click)="save()"
      >
        Guardar contacto
      </button>

    </div>

  </div>

</div>

}
