<aside
  class="sidebar"
  [class.sidebar--collapsed]="collapsed()"
>

  <div class="sidebar__top">

    <button
      class="hamburger"
      type="button"
      (click)="onToggle()"
      [attr.aria-label]="
        collapsed()
          ? 'Mostrar menú'
          : 'Ocultar menú'
      "
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    @if (!collapsed()) {
      <a
        class="sidebar__logo"
        routerLink="/inicio"
        title="Inicio de Nova"
      >
        Nova
      </a>
    }

    <button
      type="button"
      class="theme-toggle"
      (click)="onToggleTheme()"
      [attr.aria-label]="
        isDark
          ? 'Activar modo claro'
          : 'Activar modo oscuro'
      "
      [title]="
        isDark
          ? 'Modo claro'
          : 'Modo oscuro'
      "
    >
      @if (isDark) {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="currentColor" />
          <path
            d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
            fill="currentColor"
          />
        </svg>
      }
    </button>

  </div>

  <a
    class="sidebar__user"
    routerLink="/perfil"
    routerLinkActive="active"
    title="Mi perfil"
  >

    <div class="avatar">
      AM
    </div>

    @if (!collapsed()) {
      <div class="user-info">
        <span>Ana Morales</span>
        <small>admin@empresa.com</small>
      </div>
    }

  </a>

  <nav class="sidebar__menu">

    <a
      class="menu-item"
      routerLink="/contactos"
      routerLinkActive="active"
      title="Contactos"
    >
      <span class="menu-item__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path
            d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"
            fill="currentColor"
          />
        </svg>
      </span>
      @if (!collapsed()) {
        <span class="menu-item__label">Contactos</span>
      }
    </a>

    <div class="menu-group">

      <a
        class="menu-item"
        routerLink="/standby"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        title="Stand by"
      >
        <span class="menu-item__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path
              d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zM7 12h5v5H7v-5z"
              fill="currentColor"
            />
          </svg>
        </span>
        @if (!collapsed()) {
          <span class="menu-item__label">Stand by</span>
        }
      </a>

      @if (!collapsed()) {
        <div class="menu-sub">
          <a
            class="menu-sub__item"
            routerLink="/standby"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Tecnología
          </a>
          <a
            class="menu-sub__item"
            routerLink="/standby/otras-areas"
            routerLinkActive="active"
          >
            Otras áreas
          </a>
        </div>
      }

    </div>

    <a
      class="menu-item"
      routerLink="/alertas"
      routerLinkActive="active"
      title="Alertas"
    >
      <span class="menu-item__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"
            fill="currentColor"
          />
        </svg>
      </span>
      @if (!collapsed()) {
        <span class="menu-item__label">Alertas</span>
      }
    </a>

    <a
      class="menu-item"
      routerLink="/mantenimiento"
      routerLinkActive="active"
      title="Ventana de mantenimiento"
    >
      <span class="menu-item__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path
            d="M22.7 19.3l-1.4-1.4c.2-.6.3-1.2.3-1.9 0-3.3-2.7-6-6-6s-6 2.7-6 6 2.7 6 6 6c.7 0 1.3-.1 1.9-.3l1.4 1.4c.4.4 1 .4 1.4 0l2.4-2.4c.4-.4.4-1 0-1.4zM15.6 17.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5zM3 5v2h8.2c.2-.7.5-1.4.9-2H3zm0 6v2h5.2c-.1-.3-.1-.7-.1-1s0-.7.1-1H3zm0 4v2h6.1c-.5-.6-.9-1.3-1.1-2H3z"
            fill="currentColor"
          />
        </svg>
      </span>
      @if (!collapsed()) {
        <span class="menu-item__label">Ventana</span>
      }
    </a>

  </nav>

</aside>
